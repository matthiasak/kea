<!doctype html>
<html><head><title>Float</title></head>
<body>
<video id="v" muted loop playsinline style="width:320px;height:180px"></video>
<script>
// Two seconds of silence as a WAV, made here: a playing video for the float.
function silence(seconds) {
  var rate = 8000, n = rate * seconds, buf = new ArrayBuffer(44 + n * 2), d = new DataView(buf);
  function s(o, t) { for (var i = 0; i < t.length; i++) d.setUint8(o + i, t.charCodeAt(i)); }
  s(0, 'RIFF'); d.setUint32(4, 36 + n * 2, true); s(8, 'WAVE'); s(12, 'fmt ');
  d.setUint32(16, 16, true); d.setUint16(20, 1, true); d.setUint16(22, 1, true);
  d.setUint32(24, rate, true); d.setUint32(28, rate * 2, true); d.setUint16(32, 2, true); d.setUint16(34, 16, true);
  s(36, 'data'); d.setUint32(40, n * 2, true);
  return new Blob([buf], { type: 'audio/wav' });
}
var v = document.getElementById('v');
v.src = URL.createObjectURL(silence(2));
v.muted = true;
v.play().catch(function () {});
</script>
</body></html>
